# Azure DevOps Pipeline for Playwright API Tests with Allure Reporting
# Author: Starling De La Cruz
# Project: DummyJSON API Testing Framework

trigger:
  branches:
    include:
      - main
      - master
      - develop
  paths:
    exclude:
      - README.md
      - docs/*

pr:
  branches:
    include:
      - main
      - master

variables:
  nodeVersion: '20.x'
  npmCache: $(Pipeline.Workspace)/.npm

stages:

  # STAGE 1: Build and Validate
  - stage: Build
    displayName: 'Build & Validate'
    jobs:
      - job: BuildJob
        displayName: 'Install Dependencies'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              versionSpec: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache npm packages'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npmCache)

          - script: |
              npm ci --cache $(npmCache)
            displayName: 'Install npm dependencies'

          - script: |
              npx playwright install --with-deps chromium
            displayName: 'Install Playwright browsers'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish node_modules artifact'
            inputs:
              targetPath: 'node_modules'
              artifact: 'node_modules'
              publishLocation: 'pipeline'


# STAGE 2: Run API Tests
  - stage: Test
    displayName: 'Run API Tests'
    dependsOn: Build
    jobs:
      - job: APITests
        displayName: 'Execute Playwright Tests'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 30
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              versionSpec: '$(nodeVersion)'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download node_modules'
            inputs:
              buildType: 'current'
              artifactName: 'node_modules'
              targetPath: 'node_modules'

          - script: |
              npx playwright install --with-deps chromium
            displayName: 'Install Playwright browsers'

          - script: |
              npx playwright test --reporter=list,html,allure-playwright
            displayName: 'Run Playwright API Tests'
            continueOnError: true
            env:
              CI: 'true'

          - script: |
              npm install -g allure-commandline --save-dev
              allure generate allure-results --clean -o allure-report || true
            displayName: 'Generate Allure Report'
            condition: always()

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results/**/*.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              mergeTestResults: true
              failTaskOnFailedTests: false
              testRunTitle: 'Playwright API Tests - $(Build.BuildNumber)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Playwright Report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'playwright-report'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Allure Results'
            condition: always()
            inputs:
              targetPath: 'allure-results'
              artifact: 'allure-results'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Allure Report'
            condition: always()
            inputs:
              targetPath: 'allure-report'
              artifact: 'allure-report'
              publishLocation: 'pipeline'
