name: Playwright Tests with Allure Report

on:
  # Se ejecuta en TODOS los push a cualquier rama
  push:
    branches: [ '**' ]
  
  # Se ejecuta en TODOS los pull requests
  pull_request:
    branches: [ '**' ]
  
  # Se ejecuta cuando se hace merge (pull_request closed + merged)
  pull_request_target:
    types: [ closed ]
  
  # Permite ejecutar manualmente
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    # Solo ejecutar si NO es un PR cerrado sin merge
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    - name: Run Playwright tests
      id: test
      run: npx playwright test --reporter=list,html,allure-playwright 2>&1 | tee test-output.log || true
    
    - name: Parse Test Results
      id: results
      if: always()
      run: |
        # Parse results from Playwright log output
        # Example: "162 passed, 1 flaky, 1 failed (4s)"
        
        PASSED=$(grep -oE '[0-9]+ passed' test-output.log | grep -oE '[0-9]+' | head -1)
        FAILED=$(grep -oE '[0-9]+ failed' test-output.log | grep -oE '[0-9]+' | head -1)
        SKIPPED=$(grep -oE '[0-9]+ skipped' test-output.log | grep -oE '[0-9]+' | head -1)
        FLAKY=$(grep -oE '[0-9]+ flaky' test-output.log | grep -oE '[0-9]+' | head -1)
        
        # Set defaults if empty
        PASSED=${PASSED:-0}
        FAILED=${FAILED:-0}
        SKIPPED=${SKIPPED:-0}
        FLAKY=${FLAKY:-0}
        
        # Calculate total (tests únicos, sin contar reintentos)
        # Total = passed + failed + skipped + flaky (flaky son tests que pasaron después de reintentos)
        TOTAL=$((PASSED + FAILED + SKIPPED + FLAKY))
        
        # Si hay flaky, restamos del passed porque Playwright los cuenta doble
        if [ "$FLAKY" -gt 0 ]; then
          PASSED=$((PASSED - FLAKY))
        fi
        
        # Recalcular total correctamente
        TOTAL=$((PASSED + FAILED + SKIPPED + FLAKY))
        
        # Get duration
        DURATION=$(grep -oE '\([0-9]+\.?[0-9]*s\)' test-output.log | tail -1 | tr -d '()s')
        DURATION=${DURATION:-0}
        
        # Calculate pass rate (passed + flaky = successful)
        SUCCESSFUL=$((PASSED + FLAKY))
        if [ "$TOTAL" -gt 0 ]; then
          PASS_RATE=$((SUCCESSFUL * 100 / TOTAL))
        else
          PASS_RATE=0
        fi
        
        # Determine status and color
        if [ "$FAILED" -gt 0 ]; then
          STATUS="FAILED"
          COLOR="FF0000"
          EMOJI="❌"
        elif [ "$FLAKY" -gt 0 ]; then
          STATUS="FLAKY"
          COLOR="FFA500"
          EMOJI="⚠️"
        else
          STATUS="PASSED"
          COLOR="00FF00"
          EMOJI="✅"
        fi
        
        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
        echo "flaky=$FLAKY" >> $GITHUB_OUTPUT
        echo "total=$TOTAL" >> $GITHUB_OUTPUT
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
        echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
        echo "status=$STATUS" >> $GITHUB_OUTPUT
        echo "color=$COLOR" >> $GITHUB_OUTPUT
        echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
    
    - name: Install Allure
      if: always()
      run: |
        npm install --save-dev allure-playwright allure
        npm install -g allure-commandline
    
    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report || true
    
    - name: Create empty report if generation failed
      if: always()
      run: |
        mkdir -p allure-report
        if [ ! -f allure-report/index.html ]; then
          echo "<h1>Test Report</h1>" > allure-report/index.html
        fi
    
    - name: Upload Playwright Report as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    
    - name: Upload Allure Report as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
    
    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        force_orphan: true

    # NOTIFY TO MICROSOFT TEAMS - DETAILED REPORT
    - name: Notify Teams
      if: always()
      run: |
        curl -H "Content-Type: application/json" -d '{
          "@type": "MessageCard",
          "@context": "http://schema.org/extensions",
          "themeColor": "${{ steps.results.outputs.color }}",
          "summary": "${{ steps.results.outputs.emoji }} Playwright Test Results",
          "sections": [
            {
              "activityTitle": "${{ steps.results.outputs.emoji }} Playwright Test Results",
              "activitySubtitle": "${{ github.repository }} | ${{ github.ref_name }}",
              "facts": [
                { "name": "📊 Total Tests", "value": "${{ steps.results.outputs.total }}" },
                { "name": "✅ Passed", "value": "${{ steps.results.outputs.passed }}" },
                { "name": "❌ Failed", "value": "${{ steps.results.outputs.failed }}" },
                { "name": "⏭️ Skipped", "value": "${{ steps.results.outputs.skipped }}" },
                { "name": "🔄 Flaky", "value": "${{ steps.results.outputs.flaky }}" },
                { "name": "📈 Pass Rate", "value": "${{ steps.results.outputs.pass_rate }}%" },
                { "name": "⏱️ Duration", "value": "${{ steps.results.outputs.duration }}s" },
                { "name": "👤 Triggered by", "value": "${{ github.actor }}" },
                { "name": "🔗 Branch", "value": "${{ github.ref_name }}" }
              ],
              "markdown": true
            }
          ],
          "potentialAction": [
            {
              "@type": "OpenUri",
              "name": "📊 View Allure Report",
              "targets": [{ "os": "default", "uri": "https://starling26.github.io/api-testing/" }]
            },
            {
              "@type": "OpenUri",
              "name": "⚙️ View Workflow",
              "targets": [{ "os": "default", "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }]
            }
          ]
        }' ${{ secrets.TEAMS_WEBHOOK_URL }}