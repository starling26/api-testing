name: Playwright Tests with Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    - name: Run Playwright tests
      id: test
      run: npx playwright test
      continue-on-error: true
    
    - name: Install Allure
      if: always()
      run: |
        npm install --save-dev allure-playwright allure
        npm install -g allure-commandline
    
    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report || true
    
    - name: Create empty report if generation failed
      if: always()
      run: |
        mkdir -p allure-report
        if [ ! -f allure-report/index.html ]; then
          echo "<h1>Test Report</h1>" > allure-report/index.html
        fi
    
    - name: Upload Playwright Report as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    
    - name: Upload Allure Report as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
    
    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        force_orphan: true

    # ============================================
    # NOTIFY TO MICROSOFT TEAMS
    # ============================================
    - name: Notify Teams - Success
      if: steps.test.outcome == 'success'
      run: |
        curl -H "Content-Type: application/json" -d '{
          "@type": "MessageCard",
          "@context": "http://schema.org/extensions",
          "themeColor": "00FF00",
          "summary": "✅ Playwright Tests Passed",
          "sections": [{
            "activityTitle": "✅ Playwright Tests Passed",
            "facts": [
              { "name": "Repository", "value": "${{ github.repository }}" },
              { "name": "Branch", "value": "${{ github.ref_name }}" },
              { "name": "Commit", "value": "${{ github.sha }}" },
              { "name": "Triggered by", "value": "${{ github.actor }}" }
            ],
            "markdown": true
          }],
          "potentialAction": [
            {
              "@type": "OpenUri",
              "name": "View Report",
              "targets": [{ "os": "default", "uri": "https://starling26.github.io/api-testing/" }]
            },
            {
              "@type": "OpenUri",
              "name": "View Workflow",
              "targets": [{ "os": "default", "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }]
            }
          ]
        }' ${{ secrets.TEAMS_WEBHOOK_URL }}

    - name: Notify Teams - Failure
      if: steps.test.outcome == 'failure'
      run: |
        curl -H "Content-Type: application/json" -d '{
          "@type": "MessageCard",
          "@context": "http://schema.org/extensions",
          "themeColor": "FF0000",
          "summary": "❌ Playwright Tests Failed",
          "sections": [{
            "activityTitle": "❌ Playwright Tests Failed",
            "facts": [
              { "name": "Repository", "value": "${{ github.repository }}" },
              { "name": "Branch", "value": "${{ github.ref_name }}" },
              { "name": "Commit", "value": "${{ github.sha }}" },
              { "name": "Triggered by", "value": "${{ github.actor }}" }
            ],
            "markdown": true
          }],
          "potentialAction": [
            {
              "@type": "OpenUri",
              "name": "View Report",
              "targets": [{ "os": "default", "uri": "https://starling26.github.io/api-testing/" }]
            },
            {
              "@type": "OpenUri",
              "name": "View Workflow",
              "targets": [{ "os": "default", "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }]
            }
          ]
        }' ${{ secrets.TEAMS_WEBHOOK_URL }}